name: probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          mkdir -p out
          { curl -sL -A "$UA" "https://www.google.com/finance/quote/USD-EGP" -o gf.html; wc -c gf.html; grep -o 'data-last-price="[^"]*"' gf.html | head -3
            curl -sL -A "$UA" "https://query2.finance.yahoo.com/v8/finance/chart/EGP=X" | head -c 300; echo
            curl -sL -A "$UA" "https://market.isagha.com/prices" -o is.html
            python3 - <<'PY'
          import re
          h=open('is.html',encoding='utf8').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',h,flags=re.S)
          for m in re.finditer(r'24',t):
              seg=t[max(0,m.start()-200):m.end()+600]
              if re.search(r'\d{1,2},?\d{3}\.\d',seg):
                  print('=====',re.sub(r'\s+',' ',seg)); 
          i=h.find('دولار'); print('USD>>',re.sub(r'\s+',' ',h[i-300:i+500]) if i>0 else 'none')
          PY
          } > out/probe.txt 2>&1
          git config user.name ci; git config user.email ci@x
          git add out; git commit -m "probe output [skip ci]"; git push
