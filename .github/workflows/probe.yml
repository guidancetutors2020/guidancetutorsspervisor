name: probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          mkdir -p out
          { curl -sL -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/EGP=X?interval=1m&range=1d" | head -c 700; echo
            curl -sL -A "$UA" "https://market.isagha.com/prices" -o is.html; wc -c is.html
            grep -o '.\{0,500\}عيار 24.\{0,700\}' is.html | head -4
            echo ----JSON; grep -o '__NEXT_DATA__\|application/ld+json\|wire:\|livewire' is.html | sort | uniq -c
          } > out/probe.txt 2>&1
          git config user.name ci; git config user.email ci@x
          git add out; git commit -m "probe output [skip ci]"; git push
